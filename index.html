<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipHub – เว็บโปรโมตคลิปวิดีโอ + ระบบหลังบ้าน</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#14161f;--mu:#6b7280;--bd:#e3e6ee;--ac:#6d4aff;--ac2:#ff4a8d;--ok:#12a150;--dn:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--sf:#181b25;--tx:#eceef5;--mu:#9aa1b2;--bd:#272b38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--sf:#181b25;--tx:#eceef5;--mu:#9aa1b2;--bd:#272b38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
header input{flex:1;min-width:140px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--dn)}
main{max-width:1100px;margin:0 auto;padding:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:block}
.th{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.th small{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:12px;border-radius:6px;padding:1px 7px}
.cb{padding:10px 12px}.cb b{display:block}.mu{color:var(--mu);font-size:13px}
.hero{border-radius:18px;padding:28px;color:#fff;background:linear-gradient(120deg,var(--ac),var(--ac2));margin-bottom:16px}
.hero h1{margin:0 0 6px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.player{aspect-ratio:16/9;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden}
.bar{position:absolute;left:0;bottom:0;height:5px;background:#fff;width:0;transition:width .3s linear}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat b{font-size:26px;display:block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--bg);border:1px solid var(--bd)}
.ok{color:var(--ok)}.dn{color:var(--dn)}
.login{max-width:340px;margin:40px auto}
@media(max-width:520px){.row{grid-template-columns:1fr}}
header{backdrop-filter:blur(12px);background:color-mix(in srgb,var(--sf) 80%,transparent)}
.hero{position:relative;overflow:hidden;padding:40px 28px;background:linear-gradient(120deg,#6d4aff,#ff4a8d,#ffb347,#6d4aff);background-size:300% 300%;animation:flow 10s ease infinite;box-shadow:0 12px 40px #6d4aff40}
.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.2;position:relative}
.hero div{position:relative}
.bl{position:absolute;border-radius:50%;filter:blur(30px);opacity:.5;background:#fff;animation:fl 7s ease-in-out infinite}
.b1{width:160px;height:160px;right:-30px;top:-40px}
.b2{width:110px;height:110px;right:25%;bottom:-40px;animation-delay:-3s}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes fl{50%{transform:translate(-20px,20px) scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.card{transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px #6d4aff33;border-color:var(--ac)}
.th{transition:transform .4s}
.card:hover .th{transform:scale(1.06)}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(4){animation-delay:.18s}
.pl{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transform:scale(.6);transition:.25s}
.card:hover .pl{opacity:1;transform:scale(1)}
.bd{position:absolute;left:8px;top:8px;font-style:normal;font-size:12px;font-weight:700;background:linear-gradient(90deg,#ff4a8d,#ff8a3d);color:#fff;border-radius:99px;padding:2px 9px}
.chip{transition:.2s}.chip:hover{border-color:var(--ac);transform:translateY(-2px)}
.chip.on{box-shadow:0 6px 16px #6d4aff55}
button{transition:transform .15s,filter .2s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:active{transform:scale(.97)}
.player{box-shadow:0 18px 50px #6d4aff30}
.act{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
.box{animation:up .4s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.st{font-size:20px;margin:22px 0 8px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
.big{flex:0 0 min(78%,340px);scroll-snap-align:start;aspect-ratio:16/9;border-radius:18px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;transition:transform .3s,box-shadow .3s}
.big:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 36px #0006}
.big .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px}
.cap{position:relative;width:100%;padding:34px 14px 12px;background:linear-gradient(transparent,#000c)}
.cap b{display:block}.cap small{opacity:.85}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pills span{background:#fff3;backdrop-filter:blur(6px);border-radius:99px;padding:4px 12px;font-size:14px}
footer{text-align:center;color:var(--mu);padding:28px 16px 40px;font-size:14px}
footer a{text-decoration:underline}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;padding:0;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;box-shadow:0 8px 20px #6d4aff66}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.stat b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat:nth-child(1) .mu::before{content:"🎞️ "}.stat:nth-child(2) .mu::before{content:"✅ "}.stat:nth-child(3) .mu::before{content:"👁️ "}.stat:nth-child(4) .mu::before{content:"🗂️ "}
tr:hover td{background:var(--bg)}
.login{box-shadow:0 18px 50px #6d4aff2a;border-top:4px solid var(--ac)}
.tag{transition:.2s}.tag:hover{border-color:var(--ac);color:var(--ac)}
.box h2{font-size:22px}
</style>
</head>
<body>
<header>
  <a href="#home" class="logo">▶ ClipHub</a>
  <input id="q" placeholder="ค้นหาคลิป..." aria-label="ค้นหา">
  <button class="g" id="tm" aria-label="สลับธีม">🌓</button>
  <a href="#admin" class="btn g" style="color:var(--tx);background:transparent;border:1px solid var(--bd)">หลังบ้าน</a>
</header>
<main id="app"></main>
<footer>© ClipHub · โปรโมตคลิปของคุณให้คนติดตาม ❤️ · <a href="#admin">หลังบ้าน</a></footer>
<button class="fab" id="up" aria-label="ขึ้นด้านบน">↑</button>
<script>
const KEY="cliphub_demo_v1";
const seed={cats:["รีวิวสินค้า","ท่องเที่ยว","อาหาร","เทคโนโลยี"],admin:{u:"admin",p:"admin123"},
videos:[
{id:"v1",title:"รีวิวหูฟังไร้สายรุ่นใหม่",cat:"รีวิวสินค้า",desc:"ทดสอบเสียง แบตเตอรี่ และการใช้งานจริง 7 วัน",tags:"หูฟัง,รีวิว",dur:"08:42",views:1280,feat:true,pub:true,icon:"🎧"},
{id:"v2",title:"เที่ยวเชียงใหม่ 3 วัน 2 คืน",cat:"ท่องเที่ยว",desc:"แผนเที่ยวคาเฟ่ ดอยสุเทพ และตลาดกลางคืน",tags:"เชียงใหม่,เที่ยว",dur:"12:10",views:2310,feat:true,pub:true,icon:"🏔️"},
{id:"v3",title:"ผัดกะเพราสูตรง่ายใน 10 นาที",cat:"อาหาร",desc:"สูตรทำเองที่บ้าน วัตถุดิบหาง่าย",tags:"อาหาร,สูตร",dur:"05:30",views:940,feat:false,pub:true,icon:"🍳"},
{id:"v4",title:"5 แอปช่วยทำงานที่ต้องลอง",cat:"เทคโนโลยี",desc:"แอปเพิ่มประสิทธิภาพสำหรับคนทำงานยุคใหม่",tags:"แอป,ทำงาน",dur:"06:55",views:1570,feat:false,pub:true,icon:"📱"},
{id:"v5",title:"ตัวอย่างคลิปฉบับร่าง",cat:"เทคโนโลยี",desc:"ยังไม่เผยแพร่",tags:"ร่าง",dur:"01:00",views:0,feat:false,pub:false,icon:"📝"}]};
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
if(!db)db=JSON.parse(JSON.stringify(seed));
let authed=false,cat="ทั้งหมด",tab="dash",editId=null,timer=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grad=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return`linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+60)%360} 70% 45%))`};
const $=s=>document.querySelector(s);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("cliphub_files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(k,b)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const fget=async k=>{const d=await idb();return new Promise((res,rej)=>{const r=d.transaction("f").objectStore("f").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const fdel=async k=>{try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(k)}catch(e){}};
const meta=f=>new Promise(res=>{const u=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";v.muted=true;v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||0)/2)};v.onseeked=()=>{const s=Math.round(v.duration||0),c=document.createElement("canvas");c.width=320;c.height=180;let th="";try{c.getContext("2d").drawImage(v,0,0,320,180);th=c.toDataURL("image/jpeg",.6)}catch(e){}URL.revokeObjectURL(u);res({dur:String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"),th})};v.onerror=()=>{URL.revokeObjectURL(u);res({dur:"00:00",th:""})};v.src=u});
const app=$("#app");
function card(v){return`<a class="card" href="#watch-${v.id}"><div class="th" style="background:${v.th?"url("+v.th+") center/cover":grad(v.id)}">${v.th?"":v.icon||"🎬"}<small>${esc(v.dur)}</small>${v.views>=1500?'<em class="bd">🔥 ฮิต</em>':""}<span class="pl">▶</span></div><div class="cb"><b>${esc(v.title)}</b><span class="mu">${esc(v.cat)} · ${v.views.toLocaleString()} ครั้ง</span></div></a>`}
function home(){
  const q=$("#q").value.trim().toLowerCase();
  let list=db.videos.filter(v=>v.pub&&(cat==="ทั้งหมด"||v.cat===cat)&&(!q||(v.title+v.tags+v.desc).toLowerCase().includes(q)));
  const feat=db.videos.filter(v=>v.pub&&v.feat);
  app.innerHTML=`${!q&&cat==="ทั้งหมด"?`<div class="hero"><i class="bl b1"></i><i class="bl b2"></i><h1>โปรโมตคลิปของคุณ<br>ให้คนทั่วโลกเห็น ✨</h1><div>🔥 คลิปแนะนำ: ${feat.map(v=>`<a href="#watch-${v.id}" style="text-decoration:underline">${esc(v.title)}</a>`).join(" · ")||"-"}</div><div class="pills"><span>🎬 ${db.videos.filter(v=>v.pub).length} คลิป</span><span>👁️ ${db.videos.reduce((a,v)=>a+v.views,0).toLocaleString()} ครั้ง</span><span>🗂️ ${db.cats.length} หมวด</span></div></div>`:""}
  ${!q&&cat==="ทั้งหมด"&&feat.length?`<h2 class="st">⭐ คลิปแนะนำ</h2><div class="rail">${feat.map(v=>`<a class="big" href="#watch-${v.id}" style="background:${v.th?"url("+v.th+") center/cover":grad(v.id)}"><span class="ic">${v.th?"":v.icon||"🎬"}</span><div class="cap"><b>${esc(v.title)}</b><small>${esc(v.cat)} · ${v.views.toLocaleString()} ครั้ง</small></div></a>`).join("")}</div>`:""}<h2 class="st">🎬 คลิปทั้งหมด</h2><div class="chips">${["ทั้งหมด",...db.cats].map(c=>`<span class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</span>`).join("")}</div>
  <div class="grid">${list.map(card).join("")||'<p class="mu">ไม่พบคลิป</p>'}</div>`;
  app.querySelectorAll(".chip").forEach(e=>e.onclick=()=>{cat=e.dataset.c;home()});
}
function embedOf(u){
  let m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);
  if(m)return"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0&playsinline=1"+((u.match(/[?&](?:t|start)=(\d+)/)||[])[1]?"&start="+u.match(/[?&](?:t|start)=(\d+)/)[1]:"");
  m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
  if(m)return"https://player.vimeo.com/video/"+m[1];
  return null;
}
async function mountVideo(v){
  let src="";
  if(v.file){try{const b=await fget(v.id);if(b)src=URL.createObjectURL(b)}catch(e){}}
  else if(v.url){
    const pl0=document.querySelector(".player");if(!pl0)return true;
    if(!/^https?:\/\//i.test(v.url))return false;
    pl0.insertAdjacentHTML("afterend",`<p class="mu">ถ้าวิดีโอไม่แสดง <a href="${esc(v.url)}" target="_blank" rel="noopener" style="text-decoration:underline">เปิดลิงก์ในแท็บใหม่</a></p>`);
    const em=embedOf(v.url);
    if(em){
      const bad=()=>{if(!document.contains(pl0))return;pl0.innerHTML=`<div style="text-align:center;padding:16px;color:#fff"><div style="font-size:56px">▶</div><p style="margin:8px 0 12px">หน้านี้ไม่อนุญาตให้ฝังวิดีโอจากเว็บอื่น</p><a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener" style="background:#fff;color:#111">ดูบนเว็บต้นทาง</a></div>`};
      const h=e=>{if(/youtube|vimeo/.test(e.blockedURI||"")){document.removeEventListener("securitypolicyviolation",h);bad()}};
      document.addEventListener("securitypolicyviolation",h);
      pl0.innerHTML="";const fr=document.createElement("iframe");fr.src=em;fr.allow="autoplay;encrypted-media;fullscreen;picture-in-picture";fr.allowFullscreen=true;fr.referrerPolicy="strict-origin-when-cross-origin";fr.title=v.title;fr.style.cssText="width:100%;height:100%;border:0;border-radius:14px";pl0.appendChild(fr);return true}
    src=v.url;
  }
  if(!src)return false;
  const pl=document.querySelector(".player");if(!pl)return true;
  const el=document.createElement("video");el.controls=true;el.playsInline=true;el.src=src;el.style.cssText="width:100%;height:100%;background:#000;border-radius:14px";
  el.onerror=()=>{pl.innerHTML='<span style="font-size:16px;padding:16px;text-align:center">เล่นวิดีโอไม่ได้ (ไฟล์เสียหรือลิงก์ถูกบล็อก)</span>'};
  pl.innerHTML="";pl.appendChild(el);return true;
}
async function watch(id){
  const v=db.videos.find(x=>x.id===id&&x.pub);
  if(!v){app.innerHTML='<p>ไม่พบคลิป</p>';return}
  v.views++;save();
  const rel=db.videos.filter(x=>x.pub&&x.id!==id&&x.cat===v.cat).slice(0,4);
  app.innerHTML=`<div class="player" style="background:${grad(v.id)}"><span id="pi">▶</span><div class="bar" id="bar"></div></div>
  <div class="box" style="margin-top:12px"><h2 style="margin:0 0 4px">${esc(v.title)}</h2><div class="mu">${esc(v.cat)} · ${v.views.toLocaleString()} ครั้ง · ${esc(v.dur)}</div><p>${esc(v.desc)}</p><div class="act"><button class="g" id="lk">${v.liked?"❤️":"🤍"} ถูกใจ <span>${v.likes||0}</span></button><button class="g" id="sh">🔗 คัดลอกลิงก์</button></div>${v.tags.split(",").filter(Boolean).map(t=>`<span class="tag">#${esc(t.trim())}</span> `).join("")}</div>
  ${rel.length?`<h3>คลิปที่เกี่ยวข้อง</h3><div class="grid">${rel.map(card).join("")}</div>`:""}`;
  $("#lk").onclick=()=>{v.liked=!v.liked;v.likes=Math.max(0,(v.likes||0)+(v.liked?1:-1));save();$("#lk").innerHTML=(v.liked?"❤️":"🤍")+" ถูกใจ <span>"+v.likes+"</span>";$("#lk").classList.add("pop");setTimeout(()=>$("#lk").classList.remove("pop"),400)};
  $("#sh").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("#sh").textContent="✅ คัดลอกแล้ว"}catch(e){$("#sh").textContent="คัดลอกไม่ได้"}};
  let p=0,on=false;clearInterval(timer);if(await mountVideo(v))return;
  $("#pi").parentElement.onclick=()=>{on=!on;$("#pi").textContent=on?"⏸":"▶";clearInterval(timer);if(on)timer=setInterval(()=>{p=Math.min(100,p+2);$("#bar").style.width=p+"%";if(p>=100){clearInterval(timer);on=false;$("#pi").textContent="↻";p=0}},300)};
}
function admin(){
  if(!authed){
    app.innerHTML=`<div class="box login"><h2>เข้าสู่ระบบหลังบ้าน</h2><p class="mu">เดโม: admin / admin123</p><div class="row" style="grid-template-columns:1fr"><input id="u" placeholder="ชื่อผู้ใช้"><input id="p" type="password" placeholder="รหัสผ่าน"></div><button id="go">เข้าสู่ระบบ</button> <span id="er" class="dn"></span></div>`;
    $("#go").onclick=()=>{if($("#u").value===db.admin.u&&$("#p").value===db.admin.p){authed=true;admin()}else $("#er").textContent="ข้อมูลไม่ถูกต้อง"};
    return;
  }
  const tabs=[["dash","แดชบอร์ด"],["vid","จัดการคลิป"],["cat","หมวดหมู่"]];
  let body="";
  if(tab==="dash"){
    const pub=db.videos.filter(v=>v.pub),tot=db.videos.reduce((a,v)=>a+v.views,0),top=[...db.videos].sort((a,b)=>b.views-a.views).slice(0,5),mx=top[0]?.views||1;
    body=`<div class="stats"><div class="box stat"><span class="mu">คลิปทั้งหมด</span><b>${db.videos.length}</b></div><div class="box stat"><span class="mu">เผยแพร่แล้ว</span><b>${pub.length}</b></div><div class="box stat"><span class="mu">ยอดชมรวม</span><b>${tot.toLocaleString()}</b></div><div class="box stat"><span class="mu">หมวดหมู่</span><b>${db.cats.length}</b></div></div>
    <div class="box"><h3 style="margin-top:0">คลิปยอดนิยม</h3>${top.map(v=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(v.title)}</span><span class="mu">${v.views.toLocaleString()}</span></div><div style="height:8px;border-radius:6px;background:var(--bg)"><div style="height:8px;border-radius:6px;width:${v.views/mx*100}%;background:linear-gradient(90deg,var(--ac),var(--ac2))"></div></div></div>`).join("")}</div>`;
  }
  if(tab==="vid"){
    const e=db.videos.find(v=>v.id===editId)||{title:"",cat:db.cats[0],desc:"",tags:"",dur:"00:00",icon:"🎬",feat:false,pub:true};
    body=`<div class="box"><h3 style="margin-top:0">${editId?"แก้ไขคลิป":"เพิ่มคลิปใหม่"}</h3>
    <div class="row"><input id="t" placeholder="ชื่อคลิป" value="${esc(e.title)}"><select id="c">${db.cats.map(c=>`<option ${c===e.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
    <div class="row"><input id="tg" placeholder="แท็ก (คั่นด้วยคอมมา)" value="${esc(e.tags)}"><input id="du" placeholder="ความยาว 05:30" value="${esc(e.dur)}"></div>
    <div class="row"><input id="ic" placeholder="ไอคอนอีโมจิ" value="${esc(e.icon)}"><select id="pb"><option value="1" ${e.pub?"selected":""}>เผยแพร่</option><option value="0" ${!e.pub?"selected":""}>ฉบับร่าง</option></select></div>
    <div class="row"><input id="fl" type="file" accept="video/*"><input id="ur" placeholder="หรือวางลิงก์ YouTube / Vimeo / .mp4" value="${esc(e.url||"")}"></div>${e.file?'<p class="mu">มีไฟล์วิดีโอที่อัปโหลดไว้แล้ว (เลือกไฟล์ใหม่เพื่อแทนที่)</p>':""}<div id="pg" class="mu"></div><textarea id="ds" rows="3" placeholder="คำอธิบาย" style="margin-bottom:10px">${esc(e.desc)}</textarea>
    <label class="mu"><input id="ft" type="checkbox" style="width:auto" ${e.feat?"checked":""}> คลิปแนะนำหน้าแรก</label><br><br>
    <button id="sv">บันทึก</button> ${editId?'<button class="g" id="cn">ยกเลิก</button>':""} <span id="er" class="dn"></span></div>
    <div class="box tw"><table><tr><th>คลิป</th><th>หมวด</th><th>สถานะ</th><th>ชม</th><th></th></tr>${db.videos.map(v=>`<tr><td>${v.icon} ${esc(v.title)}${v.feat?" ⭐":""}</td><td>${esc(v.cat)}</td><td class="${v.pub?"ok":"mu"}">${v.pub?"เผยแพร่":"ร่าง"}</td><td>${v.views}</td><td><button class="g" data-e="${v.id}">แก้ไข</button> <button class="d" data-d="${v.id}">ลบ</button></td></tr>`).join("")}</table></div>`;
  }
  if(tab==="cat"){
    body=`<div class="box"><div class="row"><input id="nc" placeholder="ชื่อหมวดหมู่ใหม่"><button id="ac">เพิ่มหมวดหมู่</button></div>${db.cats.map((c,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)"><span>${esc(c)} <span class="mu">(${db.videos.filter(v=>v.cat===c).length} คลิป)</span></span><button class="d" data-x="${i}">ลบ</button></div>`).join("")}<p id="er" class="dn"></p></div>`;
  }
  app.innerHTML=`<div class="tabs">${tabs.map(([k,n])=>`<button class="${k===tab?"":"g"}" data-t="${k}">${n}</button>`).join("")}<button class="g" id="lo" style="margin-left:auto">ออกจากระบบ</button></div>${body}`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;editId=null;admin()});
  $("#lo").onclick=()=>{authed=false;admin()};
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{editId=b.dataset.e;admin();scrollTo(0,0)});
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("ลบคลิปนี้?")){fdel(b.dataset.d);db.videos=db.videos.filter(v=>v.id!==b.dataset.d);save();admin()}});
  app.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const c=db.cats[b.dataset.x];if(db.videos.some(v=>v.cat===c)){$("#er").textContent="ลบไม่ได้ ยังมีคลิปในหมวดนี้";return}db.cats.splice(b.dataset.x,1);save();admin()});
  if($("#ac"))$("#ac").onclick=()=>{const n=$("#nc").value.trim();if(!n||db.cats.includes(n)){$("#er").textContent="ชื่อว่างหรือซ้ำ";return}db.cats.push(n);save();admin()};
  if($("#cn"))$("#cn").onclick=()=>{editId=null;admin()};
  if($("#sv"))$("#sv").onclick=async()=>{
    const t=$("#t").value.trim();if(!t){$("#er").textContent="กรุณากรอกชื่อคลิป";return}
    const d={title:t,cat:$("#c").value,tags:$("#tg").value,dur:$("#du").value||"00:00",icon:$("#ic").value||"🎬",desc:$("#ds").value,feat:$("#ft").checked,pub:$("#pb").value==="1"};
    const id=editId||"v"+Date.now().toString(36);
    const f=$("#fl").files[0];d.url=$("#ur").value.trim();
    if(d.url&&!/^https?:\/\//i.test(d.url)){$("#er").textContent="ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://";return}
    if(f){$("#pg").textContent="กำลังบันทึกไฟล์...";const m=await meta(f);try{await fput(id,f)}catch(err){$("#pg").textContent="";$("#er").textContent="บันทึกไฟล์ไม่สำเร็จ (พื้นที่เต็มหรือเบราว์เซอร์ไม่รองรับ)";return}d.file=true;d.th=m.th;if(d.dur==="00:00")d.dur=m.dur}
    if(editId)Object.assign(db.videos.find(v=>v.id===editId),d);else db.videos.unshift({id,views:0,...d});
    editId=null;save();admin();
  };
}
function route(){
  clearInterval(timer);
  const h=location.hash.slice(1)||"home";
  if(h.startsWith("watch-"))watch(h.slice(6));else if(h==="admin")admin();else home();
  scrollTo(0,0);
}
$("#q").oninput=()=>{if(location.hash!=="#home"&&location.hash!==""){location.hash="home"}else home()};
$("#tm").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"};
const up=$("#up");addEventListener("scroll",()=>up.classList.toggle("show",scrollY>300));up.onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
